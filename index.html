
<!-- TASK MANAGEMENT MODULE -->
<div id="tasksModule">

  <h2>Task Management</h2>

  <!-- CREATE TASK -->
  <div class="task-card">
    <h3>Create New Task</h3>

    <form id="taskCreateForm">
      <input id="taskTitle" placeholder="Task title" required>

      <textarea id="taskDescription"
        placeholder="Task description"></textarea>

      <select id="taskEmployee" required>
        <option value="">Select employee</option>
      </select>

      <select id="taskPriority">
        <option value="low">Low Priority</option>
        <option value="medium" selected>Medium Priority</option>
        <option value="high">High Priority</option>
        <option value="urgent">Urgent</option>
      </select>

      <label>Deadline</label>
      <input id="taskDeadline" type="datetime-local">

      <textarea id="taskChecklist"
        placeholder="Checklist items (one per line)"></textarea>

      <button type="submit">Create Task</button>
    </form>
  </div>

  <!-- FILTERS -->
  <div class="task-card">
    <h3>Filter Tasks</h3>

    <select id="filterStatus">
      <option value="">All Statuses</option>
      <option value="assigned">Assigned</option>
      <option value="in_progress">In Progress</option>
      <option value="pending_approval">Pending Approval</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
    </select>

    <select id="filterPriority">
      <option value="">All Priorities</option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high">High</option>
      <option value="urgent">Urgent</option>
    </select>
  </div>

  <!-- TASK LIST -->
  <div id="taskList"></div>

</div>

<style>
#tasksModule {
  font-family: Arial, sans-serif;
  color: #252525;
}

#tasksModule .task-card {
  background: white;
  border: 1px solid #eee;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 18px;
}

#tasksModule input,
#tasksModule select,
#tasksModule textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 11px;
  margin: 7px 0;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: #fff;
}

#tasksModule button {
  border: none;
  border-radius: 8px;
  padding: 10px 15px;
  margin: 5px 3px;
  cursor: pointer;
  background: #b69a65;
  color: white;
  font-weight: 600;
}

#tasksModule button.secondary {
  background: #444;
}

#tasksModule button.danger {
  background: #c62828;
}

#tasksModule .task-item {
  background: white;
  border: 1px solid #eee;
  border-radius: 12px;
  padding: 16px;
  margin: 12px 0;
}

#tasksModule .task-meta {
  color: #777;
  font-size: 12px;
  margin: 8px 0;
}

#tasksModule .badge {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 11px;
  color: white;
  margin: 3px;
}

#tasksModule .history-item {
  border-left: 2px solid #b69a65;
  padding: 8px 12px;
  margin: 8px 0;
  background: #faf9f6;
}

#tasksModule .check-item {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0;
}

#tasksModule .check-item input {
  width: auto;
  margin: 0;
}
</style>

<script type="module">

/*
REQUIRED EXISTING FIREBASE VARIABLES:
db
currentUser
currentProfile

REQUIRED FIRESTORE IMPORTS:
getDocs, getDoc, addDoc, updateDoc, doc,
collection, arrayUnion
*/

let taskModuleTasks = [];
let taskModuleStaff = [];

/* STAFF DROPDOWN */

async function tmLoadStaff() {
  const snap = await getDocs(collection(db, "users"));

  taskModuleStaff = snap.docs
    .map(d => ({ id: d.id, ...d.data() }))
    .filter(u => u.role === "staff");

  const select = document.getElementById("taskEmployee");
  if (!select) return;

  select.innerHTML = '<option value="">Select employee</option>';

  taskModuleStaff.forEach(s => {
    const option = document.createElement("option");
    option.value = s.id;
    option.textContent = s.name || s.email || s.id;
    select.appendChild(option);
  });
}

/* CREATE TASK */

async function tmCreateTask(e) {
  e.preventDefault();

  const title = document.getElementById("taskTitle").value.trim();
  const description = document.getElementById("taskDescription").value.trim();
  const assignedTo = document.getElementById("taskEmployee").value;
  const priority = document.getElementById("taskPriority").value;
  const deadline = document.getElementById("taskDeadline").value;
  const checklistText = document.getElementById("taskChecklist").value;

  if (!assignedTo) {
    alert("Please select an employee.");
    return;
  }

  const checklist = checklistText
    .split("\n")
    .map(x => x.trim())
    .filter(Boolean)
    .map((text, index) => ({
      id: index,
      text,
      done: false
    }));

  const employee = taskModuleStaff.find(s => s.id === assignedTo);

  await addDoc(collection(db, "tasks"), {
    title,
    description,
    assignedTo,
    assignedToName: employee?.name || employee?.email || "",
    assignedBy: currentUser.uid,
    assignedByName: currentProfile?.name || "Manager",
    priority,
    deadline: deadline || null,
    checklist,
    status: "assigned",
    timerSeconds: 0,
    timerStartedAt: null,
    history: [{
      action: "Task created",
      by: currentProfile?.name || "Manager",
      at: new Date().toISOString()
    }],
    createdAt: new Date().toISOString()
  });

  e.target.reset();

  await tmLoadTasks();
  alert("Task created successfully.");
}

/* LOAD TASKS */

async function tmLoadTasks() {
  const snap = await getDocs(collection(db, "tasks"));

  taskModuleTasks = snap.docs.map(d => ({
    id: d.id,
    ...d.data()
  }));

  tmRenderTasks();
}

/* PRIORITY BADGES */

function tmPriorityBadge(priority) {
  const colors = {
    low: "#64748b",
    medium: "#2563eb",
    high: "#d97706",
    urgent: "#dc2626"
  };

  return `
    <span class="badge"
      style="background:${colors[priority] || colors.medium}">
      ${(priority || "medium").toUpperCase()}
    </span>`;
}

/* STATUS BADGES */

function tmStatusBadge(status) {
  const colors = {
    assigned: "#64748b",
    in_progress: "#2563eb",
    pending_approval: "#d97706",
    approved: "#15803d",
    rejected: "#dc2626"
  };

  return `
    <span class="badge"
      style="background:${colors[status] || "#555"}">
      ${(status || "assigned").replaceAll("_", " ").toUpperCase()}
    </span>`;
}

/* TIMER */

function tmTimer(task) {
  let seconds = Number(task.timerSeconds || 0);

  if (task.timerStartedAt) {
    seconds += Math.max(0, Math.floor(
      (Date.now() - new Date(task.timerStartedAt).getTime()) / 1000
    ));
  }

  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;

  return `${h}h ${m}m ${s}s`;
}

async function tmStartTimer(id) {
  const task = taskModuleTasks.find(t => t.id === id);
  if (!task || task.timerStartedAt) return;

  await updateDoc(doc(db, "tasks", id), {
    timerStartedAt: new Date().toISOString(),
    status: "in_progress",
    history: arrayUnion({
      action: "Timer started",
      by: currentProfile?.name || "Staff",
      at: new Date().toISOString()
    })
  });

  await tmLoadTasks();
}

async function tmPauseTimer(id) {
  const task = taskModuleTasks.find(t => t.id === id);
  if (!task?.timerStartedAt) return;

  const elapsed = Math.max(0, Math.floor(
    (Date.now() - new Date(task.timerStartedAt).getTime()) / 1000
  ));

  await updateDoc(doc(db, "tasks", id), {
    timerSeconds: (task.timerSeconds || 0) + elapsed,
    timerStartedAt: null,
    history: arrayUnion({
      action: "Timer paused",
      by: currentProfile?.name || "Staff",
      at: new Date().toISOString()
    })
  });

  await tmLoadTasks();
}

/* DEADLINE */

function tmDeadline(task) {
  if (!task.deadline) return "No deadline";

  const remaining = new Date(task.deadline).getTime() - Date.now();

  if (remaining <= 0) {
    return '<span style="color:#dc2626">Overdue</span>';
  }

  const days = Math.floor(remaining / 86400000);
  const hours = Math.floor((remaining % 86400000) / 3600000);
  const minutes = Math.floor((remaining % 3600000) / 60000);

  return `${days}d ${hours}h ${minutes}m remaining`;
}

/* CHECKLIST */

async function tmToggleChecklist(id, index, checked) {
  const task = taskModuleTasks.find(t => t.id === id);
  if (!task) return;

  const checklist = [...(task.checklist || [])];

  checklist[index] = {
    ...checklist[index],
    done: checked
  };

  await updateDoc(doc(db, "tasks", id), {
    checklist,
    history: arrayUnion({
      action: checked ? "Checklist item completed" : "Checklist item unchecked",
      by: currentProfile?.name || "Staff",
      at: new Date().toISOString()
    })
  });

  await tmLoadTasks();
}

/* TASK APPROVAL */

async function tmApproveTask(id) {
  await updateDoc(doc(db, "tasks", id), {
    status: "approved",
    approvedBy: currentUser.uid,
    approvedByName: currentProfile?.name || "Manager",
    approvedAt: new Date().toISOString(),
    history: arrayUnion({
      action: "Task approved",
      by: currentProfile?.name || "Manager",
      at: new Date().toISOString()
    })
  });

  await tmLoadTasks();
}

async function tmRejectTask(id) {
  const reason = prompt("Enter rejection reason:");

  if (!reason || !reason.trim()) return;

  await updateDoc(doc(db, "tasks", id), {
    status: "rejected",
    rejectionReason: reason.trim(),
    history: arrayUnion({
      action: "Task rejected",
      by: currentProfile?.name || "Manager",
      reason: reason.trim(),
      at: new Date().toISOString()
    })
  });

  await tmLoadTasks();
}

/* SUBMIT FOR APPROVAL */

async function tmSubmitApproval(id) {
  const task = taskModuleTasks.find(t => t.id === id);
  if (!task) return;

  if (task.timerStartedAt) {
    alert("Pause the task timer before submitting.");
    return;
  }

  await updateDoc(doc(db, "tasks", id), {
    status: "pending_approval",
    history: arrayUnion({
      action: "Submitted for approval",
      by: currentProfile?.name || "Staff",
      at: new Date().toISOString()
    })
  });

  await tmLoadTasks();
}

/* HISTORY */

function tmHistory(task) {
  return (task.history || []).slice().reverse().map(h => `
    <div class="history-item">
      <strong>${tmEscape(h.action || "")}</strong>
      <div>${tmEscape(h.by || "User")}</div>
      <small>${tmEscape(h.at || "")}</small>
      ${h.reason ? `<p>${tmEscape(h.reason)}</p>` : ""}
    </div>
  `).join("") || "No history";
}

/* SAFE TEXT */

function tmEscape(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

/* RENDER TASKS */

function tmRenderTasks() {
  const status = document.getElementById("filterStatus")?.value || "";
  const priority = document.getElementById("filterPriority")?.value || "";

  let filtered = taskModuleTasks;

  if (currentProfile?.role === "staff") {
    filtered = filtered.filter(t => t.assignedTo === currentUser.uid);
  }

  if (status) filtered = filtered.filter(t => t.status === status);
  if (priority) filtered = filtered.filter(t => t.priority === priority);

  const container = document.getElementById("taskList");
  if (!container) return;

  if (!filtered.length) {
    container.innerHTML = `
      <div class="task-card">
        No tasks found.
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(task => {
    const checklist = task.checklist || [];
    const completed = checklist.filter(x => x.done).length;

    const canManage = ["admin", "manager"].includes(currentProfile?.role);
    const isAssignedStaff = task.assignedTo === currentUser.uid;

    return `
      <div class="task-item">

        <h3>${tmEscape(task.title)}</h3>

        ${tmPriorityBadge(task.priority)}
        ${tmStatusBadge(task.status)}

        <p>${tmEscape(task.description || "")}</p>

        <div class="task-meta">
          Employee: ${tmEscape(task.assignedToName || task.assignedTo || "")}
        </div>

        <div class="task-meta">
          Deadline: ${tmDeadline(task)}
        </div>

        <div class="task-meta">
          Timer: <strong>${tmTimer(task)}</strong>
        </div>

        <h4>Checklist (${completed}/${checklist.length})</h4>

        ${checklist.map((item, index) => `
          <label class="check-item">
            <input type="checkbox"
              ${item.done ? "checked" : ""}
              ${!(isAssignedStaff || canManage) ? "disabled" : ""}
              onchange="tmToggleChecklist('${task.id}',${index},this.checked)">
            <span>${tmEscape(item.text)}</span>
          </label>
        `).join("")}

        <div style="margin-top:12px">

          ${isAssignedStaff && !task.timerStartedAt &&
            !["approved","pending_approval"].includes(task.status) ?
            `<button onclick="tmStartTimer('${task.id}')">Start Task</button>` : ""}

          ${isAssignedStaff && task.timerStartedAt ?
            `<button class="secondary" onclick="tmPauseTimer('${task.id}')">Pause Task</button>` : ""}

          ${isAssignedStaff && !task.timerStartedAt &&
            ["assigned","in_progress","rejected"].includes(task.status) ?
            `<button onclick="tmSubmitApproval('${task.id}')">Submit for Approval</button>` : ""}

          ${canManage && task.status === "pending_approval" ?
            `<button onclick="tmApproveTask('${task.id}')">Approve</button>
             <button class="danger" onclick="tmRejectTask('${task.id}')">Reject</button>` : ""}

        </div>

        ${task.rejectionReason ?
          `<p style="color:#dc2626">Rejection: ${tmEscape(task.rejectionReason)}</p>` : ""}

        <details style="margin-top:15px">
          <summary>Task History</summary>
          ${tmHistory(task)}
        </details>

      </div>`;
  }).join("");
}

/* INITIALIZE */

async function initTaskModule() {
  await tmLoadStaff();

  document.getElementById("taskCreateForm")
    ?.addEventListener("submit", tmCreateTask);

  document.getElementById("filterStatus")
    ?.addEventListener("change", tmRenderTasks);

  document.getElementById("filterPriority")
    ?.addEventListener("change", tmRenderTasks);

  await tmLoadTasks();
}

/* REFRESH TIMER DISPLAY */

setInterval(() => {
  const timerElements = document.querySelectorAll("#taskList .task-item");
  if (!timerElements.length) return;

  tmRenderTasks();
}, 1000);

/*
CALL initTaskModule() AFTER:
1. Firebase login completes
2. currentUser is available
3. currentProfile is loaded
*/

</script>
