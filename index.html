
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tasks by Style and Streax</title>

<style>
:root{
--bg:#f5f6f8;--surface:#fff;--text:#20232a;
--muted:#737987;--line:#e7e9ee;--gold:#c6a76a;
--gold-dark:#9b7a3d;--nav:#fff;
--shadow:0 8px 25px #1720330a
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.topbar{
height:70px;background:#fff;border-bottom:1px solid var(--line);
display:flex;align-items:center;justify-content:space-between;
padding:0 28px;position:sticky;top:0;z-index:5
}
.brand{font-weight:800;font-size:18px}
.brand span{color:var(--gold-dark)}
.topright{display:flex;gap:12px;align-items:center}
.pill{background:#f5f1e8;color:#80632b;padding:8px 12px;border-radius:30px;font-size:12px;font-weight:700}
.layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 70px)}
.sidebar{background:var(--nav);border-right:1px solid var(--line);padding:22px 14px}
.navlabel{font-size:11px;color:#a0a5af;font-weight:800;letter-spacing:1px;padding:8px 12px}
.navbtn{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:12px;border-radius:10px;text-align:left;color:#626978;margin:3px 0;font-weight:600}
.navbtn:hover,.navbtn.active{background:#f5f1e8;color:#755a2b}
.navbtn .ico{width:22px;text-align:center;font-size:17px}
.main{padding:28px;max-width:1500px;width:100%;margin:auto}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
.pagehead h1{font-size:26px;margin:0 0 7px}
.sub{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:700;background:var(--gold);color:#211a0e}
.btn:hover{background:#b89450}
.btn.secondary{background:#f1f2f5;color:#454b57}
.btn.danger{background:#fff0f0;color:#b23b3b}
.btn.small{padding:7px 10px;font-size:12px}
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}
.stat,.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.stat{padding:20px}
.stat .label{font-size:12px;color:var(--muted);font-weight:600}
.stat .num{font-size:30px;font-weight:800;margin:8px 0}
.stat .hint{font-size:12px;color:#9298a3}
.cols{grid-template-columns:1.4fr 1fr}
.card{padding:20px;margin-bottom:16px}
.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.card h3{margin:0;font-size:16px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;color:#626978;font-weight:700}
.field input,.field textarea,.field select,.search{
width:100%;padding:12px;border:1px solid #dfe2e8;border-radius:9px;background:#fff;color:#20232a
}
textarea{min-height:85px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);font-size:13px}
th{color:#858b97;font-size:11px;text-transform:uppercase}
.status{display:inline-block;padding:5px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#f0f1f4;color:#626978}
.status.pending,.status.pending_approval{background:#fff4dc;color:#956b1c}
.status.assigned,.status.in_progress{background:#eaf2ff;color:#3566b3}
.status.completed,.status.approved{background:#e8f7ed;color:#267847}
.status.overdue{background:#ffeded;color:#b23b3b}
.empty{padding:24px;text-align:center;color:#9096a2;font-size:13px}
.taskitem{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;align-items:center}
.taskitem p{margin:5px 0 0;color:var(--muted);font-size:12px}
.quicklinks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick{border:1px solid var(--line);border-radius:10px;padding:15px;background:#fff;text-align:left}
.quick b{display:block;margin:7px 0 4px}
.quick small{color:var(--muted)}
.hidden{display:none!important}
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.loginbox{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:var(--shadow)}
.loginbox h1{margin:0 0 8px}
.loginbox .field{margin:14px 0}
.message{padding:12px;border-radius:9px;background:#f5f1e8;color:#6d5527;margin:12px 0;font-size:13px}
@media(max-width:900px){
.layout{grid-template-columns:1fr}
.sidebar{display:flex;overflow:auto;gap:4px;padding:10px;border-bottom:1px solid var(--line);position:sticky;top:70px;z-index:4}
.navlabel{display:none}
.navbtn{white-space:nowrap;width:auto;padding:10px}
.main{padding:18px}
.stats{grid-template-columns:repeat(2,1fr)}
.cols{grid-template-columns:1fr}
.topbar{padding:0 16px}
}
@media(max-width:520px){
.stats{gap:10px}
.stat{padding:14px}
.stat .num{font-size:24px}
.formgrid{grid-template-columns:1fr}
.field.full{grid-column:auto}
.pagehead h1{font-size:22px}
.quicklinks{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginView" class="loginwrap">
<div class="loginbox">
<div class="brand">Tasks <span>by Style and Streax</span></div>
<h1 style="margin-top:24px">Welcome back</h1>
<p class="sub">Sign in to your workspace</p>
<div id="loginMsg"></div>
<form id="loginForm">
<div class="field">
<label>Email address</label>
<input id="email" type="email" required placeholder="name@company.com">
</div>
<div class="field">
<label>Password</label>
<input id="password" type="password" required placeholder="Password">
</div>
<button class="btn" style="width:100%;margin-top:10px">Sign in</button>
</form>
</div>
</div>

<!-- APP -->
<div id="appView" class="app hidden">
<header class="topbar">
<div class="brand">Tasks <span>by Style and Streax</span></div>
<div class="topright">
<span id="rolePill" class="pill">Workspace</span>
<button class="btn secondary small" id="logoutBtn">Log out</button>
</div>
</header>

<div class="layout">
<aside class="sidebar">
<div class="navlabel">WORKSPACE</div>
<button class="navbtn active" data-page="dashboard">▦ Dashboard</button>
<button class="navbtn" data-page="tasks">☑ Tasks</button>
<button class="navbtn" data-page="approvals">✓ Approvals</button>
<button class="navbtn" data-page="staff">♙ Staff</button>
<button class="navbtn" data-page="appointments">▣ Appointments</button>
<button class="navbtn" data-page="services">✦ Service checklist</button>
<button class="navbtn" data-page="inventory">▤ Inventory</button>
<button class="navbtn" data-page="notifications">♧ Notifications</button>
<button class="navbtn" data-page="reports">▥ Reports</button>
<button class="navbtn" data-page="settings">⚙ Settings</button>
</aside>
<main class="main" id="mainContent"></main>
</div>
</div>

<script type="module">

import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';

import {
getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut
} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';

import {
getFirestore,doc,getDoc,collection,query,where,getDocs,
addDoc,updateDoc,serverTimestamp
} from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js';

const firebaseConfig={
apiKey:"AIzaSyAJWN-JEGv-K9jaJ494XUpsDgWtx6sziLg",
authDomain:"staff-task-manager-ss.firebaseapp.com",
projectId:"staff-task-manager-ss",
storageBucket:"staff-task-manager-ss.firebasestorage.app",
messagingSenderId:"115839865662",
appId:"1:115839865662:web:3e1c43bef8268dd102d26f",
measurementId:"G-W4B8RQHSE2"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let userProfile={name:'User',role:'staff'};
let allTasks=[];
let activePage='dashboard';

const $=id=>document.getElementById(id);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c])));

const status=s=>`<span class="status ${esc(s)}">${esc((s||'pending').replaceAll('_',' '))}</span>`;

$('loginForm').addEventListener('submit',async e=>{
e.preventDefault();
$('loginMsg').innerHTML='<div class="message">Signing in…</div>';
try{
await signInWithEmailAndPassword(auth,$('email').value,$('password').value);
}catch(err){
$('loginMsg').innerHTML=`<div class="message">${esc(err.message)}</div>`;
}
});

$('logoutBtn').onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
currentUser=user;
if(!user){
$('loginView').classList.remove('hidden');
$('appView').classList.add('hidden');
return;
}
try{
const p=await getDoc(doc(db,'users',user.uid));
userProfile=p.exists()?p.data():{name:user.email,role:'staff'};
}catch(e){
userProfile={name:user.email,role:'staff'};
}
$('loginView').classList.add('hidden');
$('appView').classList.remove('hidden');
$('rolePill').textContent=(userProfile.role||'staff').toUpperCase();
await loadTasks();
showPage(activePage);
});

async function loadTasks(){
try{
const snap=await getDocs(collection(db,'tasks'));
allTasks=snap.docs.map(d=>({id:d.id,...d.data()}));
}catch(e){
allTasks=[];
console.error(e);
}
}

const canManage=()=>['admin','manager'].includes(String(userProfile.role).toLowerCase());

function nav(){
document.querySelectorAll('.navbtn').forEach(b=>{
b.classList.toggle('active',b.dataset.page===activePage);
b.onclick=()=>showPage(b.dataset.page);
});
}

function head(title,sub,action=''){
return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${action}</div>`;
}

function stat(label,n,hint){
return `<div class="stat"><div class="label">${label}</div><div class="num">${n}</div><div class="hint">${hint}</div></div>`;
}

function taskRows(tasks){
if(!tasks.length)return '<div class="empty">No tasks found.</div>';
return `<div class="tablewrap"><table>
<thead><tr><th>Task</th><th>Assigned to</th><th>Status</th><th>Action</th></tr></thead>
<tbody>${tasks.map(t=>`<tr>
<td><strong>${esc(t.title||'Untitled')}</strong><br><span class="sub">${esc(t.description||'')}</span></td>
<td>${esc(t.assignedName||t.assignedTo||'—')}</td>
<td>${status(t.status)}</td>
<td>${t.status==='pending_approval'&&canManage()?`<button class="btn small" onclick="approve('${t.id}')">Approve</button>`:''}</td>
</tr>`).join('')}</tbody></table></div>`;
}

function showPage(page){
activePage=page;
nav();

const main=$('mainContent');
const my=allTasks.filter(t=>t.assignedTo===currentUser.uid);
const pending=allTasks.filter(t=>t.status==='pending_approval');

if(page==='dashboard'){
main.innerHTML=head(`Welcome, ${esc(userProfile.name||'User')} 👋`,'Here is your workspace overview.')
+`<div class="grid stats">
${stat('All tasks',allTasks.length,'Workspace tasks')}
${stat('My tasks',my.length,'Assigned to you')}
${stat('Awaiting approval',pending.length,'Need review')}
${stat('Completed',allTasks.filter(t=>t.status==='approved'||t.status==='completed').length,'Finished tasks')}
</div>
<div class="grid cols">
<section class="card"><div class="cardhead"><h3>Recent tasks</h3><button class="btn secondary small" onclick="page('tasks')">View all</button></div>${taskRows(allTasks.slice(0,6))}</section>
<section class="card"><div class="cardhead"><h3>Quick actions</h3></div>
<div class="quicklinks">
<button class="quick" onclick="page('tasks')">＋<b>Create task</b><small>Assign work</small></button>
<button class="quick" onclick="page('appointments')">▣<b>Appointment</b><small>Schedule visit</small></button>
<button class="quick" onclick="page('inventory')">▤<b>Inventory</b><small>Stock control</small></button>
<button class="quick" onclick="page('services')">✦<b>Checklist</b><small>Service steps</small></button>
<button class="quick" onclick="page('reports')">▥<b>Reports</b><small>Review activity</small></button>
<button class="quick" onclick="page('staff')">♙<b>Staff</b><small>Team directory</small></button>
</div></section></div>`;
}

else if(page==='tasks'){
main.innerHTML=head('Tasks','Create, assign and track work.')
+(canManage()?`<section class="card"><div class="cardhead"><h3>Create task</h3></div>
<form id="taskForm" class="formgrid">
<div class="field"><label>Task title *</label><input name="title" required placeholder="Task title"></div>
<div class="field"><label>Assign to (UID)</label><input name="assignedTo" required placeholder="Staff UID"></div>
<div class="field full"><label>Description</label><textarea name="description"></textarea></div>
<div class="field"><label>Due date</label><input name="dueDate" type="date"></div>
<div class="field"><label>Priority</label><select name="priority"><option>Normal</option><option>High</option><option>Urgent</option><option>Low</option></select></div>
<div class="field full"><label>Checklist (one item per line)</label><textarea name="checklist" placeholder="Sanitize tools&#10;Prepare products"></textarea></div>
<div class="field full"><button class="btn">Assign task</button></div>
</form></section>`:'')
+`<section class="card"><div class="cardhead"><h3>${canManage()?'All tasks':'My tasks'}</h3><input class="search" style="max-width:250px" id="taskSearch" placeholder="Search tasks…"></div><div id="taskTable">${taskRows(canManage()?allTasks:my)}</div></section>`;

if($('taskForm'))$('taskForm').onsubmit=createTask;

$('taskSearch').oninput=e=>{
const list=(canManage()?allTasks:my).filter(t=>(t.title||'').toLowerCase().includes(e.target.value.toLowerCase()));
$('taskTable').innerHTML=taskRows(list);
};
}

else if(page==='approvals'){
main.innerHTML=head('Approvals','Review completed work submitted by your team.')
+`<section class="card"><div class="cardhead"><h3>Pending approval</h3></div>${taskRows(canManage()?pending:pending.filter(t=>t.assignedBy===currentUser.uid))}</section>`;
}


else if(page==='staff'){
main.innerHTML=head('Staff Management','Manage your salon team.')
+`<section class="card">
<div class="cardhead"><h3>Add staff member</h3></div>
<form id="staffForm" class="formgrid">
<div class="field"><label>Full name</label><input name="name" required></div>
<div class="field"><label>Email</label><input name="email" type="email" required></div>
<div class="field"><label>Role</label>
<select name="role">
<option value="staff">Staff</option>
<option value="manager">Manager</option>
<option value="admin">Admin</option>
</select></div>
<div class="field"><label>Department</label>
<select name="department">
<option>Hair</option><option>Makeup</option>
<option>Skin</option><option>Nails</option>
<option>Reception</option><option>Management</option>
</select></div>
<div class="field full"><button class="btn">Save staff profile</button></div>
</form></section>
<section class="card">
<div class="cardhead"><h3>Team members</h3></div>
<div id="staffList">Loading staff...</div>
</section>`;
loadStaff();
$('staffForm').onsubmit=saveStaff;
}

main.innerHTML=head('Staff','Team directory and roles.')
+`<section class="card"><h3>Team members</h3><div class="message">Staff directory requires secure admin permissions. User profiles are managed in Firebase Authentication and Firestore users.</div></section>`;
}

else{
const configs={
appointments:['Appointments','Schedule client appointments','Client name','Service','Date and time','Assigned staff'],
services:['Service checklist','Track service steps','Client name','Service name','Date','Staff'],
inventory:['Inventory','Products and stock levels','Product name','Category','Quantity','Low-stock threshold'],
notifications:['Notifications','Workspace updates','Title','Message','Date','Recipient'],
reports:['Reports','Operational overview','Report title','Notes','Date','Owner'],
settings:['Settings','Workspace preferences','Setting name','Value','Date','Owner']
};
const c=configs[page];
main.innerHTML=head(c[0],c[1])
+`<section class="card"><div class="cardhead"><h3>Add record</h3></div>
<form id="genericForm" class="formgrid">
<div class="field"><label>${c[2]}</label><input name="a" required></div>
<div class="field"><label>${c[3]}</label><input name="b"></div>
<div class="field"><label>${c[4]}</label><input name="c"></div>
<div class="field"><label>${c[5]}</label><input name="d"></div>
<div class="field full"><button class="btn">Save</button></div>
</form></section>
<section class="card"><div class="cardhead"><h3>${c[0]} list</h3></div><div id="genericList">Loading…</div></section>`;
loadGeneric(page);
$('genericForm').onsubmit=e=>saveGeneric(e,page);
}
}

window.page=showPage;

window.approve=async id=>{
try{
await updateDoc(doc(db,'tasks',id),{
status:'approved',
approvedBy:currentUser.uid,
approvedAt:serverTimestamp()
});
await loadTasks();
showPage('approvals');
}catch(e){alert(e.message)}
};

async function createTask(e){
e.preventDefault();
const f=new FormData(e.target);
const assignee=f.get('assignedTo').trim();
try{
await addDoc(collection(db,'tasks'),{
title:f.get('title').trim(),
description:f.get('description').trim(),
assignedTo:assignee,
assignedName:assignee,
status:'assigned',
priority:f.get('priority'),
dueDate:f.get('dueDate'),
checklist:String(f.get('checklist')).split('\n').filter(Boolean).map(text=>({text,done:false})),
assignedBy:currentUser.uid,
createdAt:serverTimestamp()
});
e.target.reset();
await loadTasks();
showPage('tasks');
alert('Task assigned');
}catch(err){alert('Could not create task: '+err.message)}
}

async function loadGeneric(page){
try{
const s=await getDocs(collection(db,page));
$('genericList').innerHTML=s.empty?'<div class="empty">No records yet.</div>':
s.docs.map(d=>{
const x=d.data();
return `<div class="taskitem"><div><b>${esc(x.a||x.title||x.name||'Record')}</b><p>${esc(x.b||x.message||'')}</p></div><span class="status">${esc(x.c||x.status||'saved')}</span></div>`;
}).join('');
}catch(e){$('genericList').innerHTML=`<div class="message">${esc(e.message)}</div>`}
}

async function saveGeneric(e,page){
e.preventDefault();
const f=new FormData(e.target);
try{
await addDoc(collection(db,page),{
a:f.get('a'),b:f.get('b'),c:f.get('c'),d:f.get('d'),
createdBy:currentUser.uid,createdAt:serverTimestamp()
});
e.target.reset();
loadGeneric(page);
alert('Saved');
}catch(err){alert(err.message)}
}

async function loadStaff(){
try{
const snap=await getDocs(collection(db,'users'));
$('staffList').innerHTML=snap.empty?
'<div class="empty">No staff profiles found.</div>':
`<div class="tablewrap"><table>
<thead><tr><th>Name</th><th>Role</th><th>Department</th></tr></thead>
<tbody>${snap.docs.map(d=>{
const x=d.data();
return `<tr>
<td>${esc(x.name||'Unnamed')}<br>${esc(x.email||'')}</td>
<td>${esc(x.role||'staff')}</td>
<td>${esc(x.department||'—')}</td>
</tr>`;
}).join('')}</tbody></table></div>`;
}catch(e){
$('staffList').innerHTML='<div class="message">Unable to load staff.</div>';
}
}

async function saveStaff(e){
e.preventDefault();
const f=new FormData(e.target);
const email=f.get('email').trim();
try{
const snap=await getDocs(query(collection(db,'users'),where('email','==',email)));
if(snap.empty){
alert('Create this employee in Firebase Authentication first.');
return;
}
const staffDoc=snap.docs[0];
await updateDoc(doc(db,'users',staffDoc.id),{
name:f.get('name'),
email:email,
role:f.get('role'),
department:f.get('department')
});
e.target.reset();
loadStaff();
alert('Staff profile updated');
}catch(err){alert(err.message)}
}

</script>
</body>
</html>
