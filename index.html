
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tasks by Style and Streax</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:white}
header{background:#202020;padding:20px;font-size:22px;font-weight:bold}
main{padding:20px}
input,select,textarea,button{width:100%;padding:14px;margin:8px 0;box-sizing:border-box;border-radius:8px;border:0}
button{background:#c6a76a;color:#111;font-weight:bold;cursor:pointer}
.card{background:#222;padding:16px;border-radius:12px;margin:12px 0}
.small{color:#aaa;font-size:13px}
.hidden{display:none}
</style>
</head>
<body>

<header>Tasks by Style and Streax</header>
<main>
<h3>Staff Task Manager</h3>

<div class="card" id="loginBox">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
</div>

<div id="dashboard" class="hidden">
<p id="welcome"></p>
<button onclick="logout()">LOGOUT</button>

<div id="createBox" class="hidden card">
<h3>Create Task</h3>
<input id="taskTitle" placeholder="Task title">
<textarea id="taskDescription" placeholder="Task description"></textarea>
<select id="assignUser"><option value="">Select staff/manager</option></select>
<button onclick="createTask()">ASSIGN TASK</button>
</div>

<div id="myTasks"></div>

<div id="approvalBox" class="hidden">
<button onclick="showApprovals()">MANAGER APPROVALS</button>
<div id="approvalTasks"></div>
</div>
</div>

<div id="message"></div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import {
getFirestore,collection,query,where,getDocs,addDoc,
updateDoc,doc,getDoc
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAJWN-JEGv-K9jaJ494XUpsDgWtx6sziLg",
authDomain:"staff-task-manager-ss.firebaseapp.com",
projectId:"staff-task-manager-ss",
storageBucket:"staff-task-manager-ss.firebasestorage.app",
messagingSenderId:"115839865662",
appId:"1:115839865662:web:3e1c43bef8268dd102d26f",
measurementId:"G-W4B8RQHSE2"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const ADMIN_UID="YWv2dR9lOWQa8Dnp3YBAd1rw7oD3";

let currentUser=null;
let currentRole="staff";

const $=id=>document.getElementById(id);

window.login=async()=>{
try{
const result=await signInWithEmailAndPassword(auth,$("email").value,$("password").value);
currentUser=result.user;

const profile=await getDoc(doc(db,"users",currentUser.uid));
currentRole=profile.exists()?profile.data().role:"staff";
if(currentUser.uid===ADMIN_UID) currentRole="admin";

$("loginBox").classList.add("hidden");
$("dashboard").classList.remove("hidden");
$("welcome").innerText="Welcome "+(profile.exists()?profile.data().name:"User")+" ("+currentRole+")";$("message").innerText="";

if(currentRole==="admin"||currentRole==="manager"){
$("createBox").classList.remove("hidden");
$("approvalBox").classList.remove("hidden");
await loadUsers();
}

await loadTasks();
}catch(e){$("message").innerText=e.message;}
};

window.logout=async()=>{
await signOut(auth);
location.reload();
};

async function loadUsers(){
const snapshot=await getDocs(collection(db,"users"));
$("assignUser").innerHTML='<option value="">Select staff/manager</option>';

snapshot.forEach(d=>{
if(d.id===currentUser.uid)return;
const u=d.data();
const option=document.createElement("option");
option.value=d.id;
option.textContent=(u.name||"User")+" ("+(u.role||"staff")+")";
$("assignUser").appendChild(option);
});
}

window.createTask=async()=>{
try{
const title=$("taskTitle").value.trim();
const assignedTo=$("assignUser").value;
if(!title||!assignedTo){alert("Enter title and select assignee");return;}

await addDoc(collection(db,"tasks"),{
title,
description:$("taskDescription").value,
assignedTo,
assignedBy:currentUser.uid,
status:"assigned",
createdAt:new Date().toISOString()
});

alert("Task assigned");
$("taskTitle").value="";
$("taskDescription").value="";
await loadTasks();
}catch(e){alert(e.message);}
};

async function loadTasks(){
const q=query(collection(db,"tasks"),where("assignedTo","==",currentUser.uid));
const snapshot=await getDocs(q);
$("myTasks").innerHTML="<h3>My Tasks</h3>";

snapshot.forEach(d=>{
const t=d.data();
const card=document.createElement("div");
card.className="card";
card.innerHTML=`
<h3>${t.title||"Untitled"}</h3>
<p>${t.description||""}</p>
<p>Status: ${t.status}</p>
`;
if(t.status==="assigned"){
const b=document.createElement("button");
b.textContent="MARK COMPLETE";
b.onclick=()=>completeTask(d.id);
card.appendChild(b);
}
$("myTasks").appendChild(card);
});
}

window.completeTask=async(id)=>{
try{
await updateDoc(doc(db,"tasks",id),{status:"pending_approval"});
alert("Submitted for approval");
await loadTasks();
}catch(e){alert(e.message);}
};

window.showApprovals=async()=>{
try{
const q=query(collection(db,"tasks"),where("status","==","pending_approval"));
const snapshot=await getDocs(q);
$("approvalTasks").innerHTML="<h3>Awaiting Approval</h3>";

snapshot.forEach(d=>{
const t=d.data();
const card=document.createElement("div");
card.className="card";
card.innerHTML=`<h3>${t.title}</h3><p>${t.description||""}</p>`;
const b=document.createElement("button");
b.textContent="APPROVE";
b.onclick=()=>approveTask(d.id);
card.appendChild(b);
$("approvalTasks").appendChild(card);
});
}catch(e){$("approvalTasks").innerText=e.message;}
};

window.approveTask=async(id)=>{
try{
await updateDoc(doc(db,"tasks",id),{status:"approved"});
alert("Task approved");
await showApprovals();
}catch(e){alert(e.message);}
};
</script>
</body>
</html>
